<text class="ink2" x="592.8" y="75" font-size="13">Ländersteuern 34.3</text>
<rect class="f-eu" x="742.4" y="64" width="12" height="12" rx="2"/>
<text class="ink2" x="760.4" y="75" font-size="13">EU (Zölle) 5.9</text>
<g>
