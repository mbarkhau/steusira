<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Steuereinnahmen Deutschland 2025</title>
<desc id="desc">Treemap of tax revenue in Germany 2025 by tax type, total about 987.8 billion euro. Area is proportional to revenue. Color shows the level of government that receives the tax.</desc>
<style>
.bg{fill:#fcfcfb}
.ink1{fill:#0b0b0b}
.ink2{fill:#52514e}
.tile{stroke:#fcfcfb;stroke-width:2}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.tile:hover{opacity:.85}
.f-gemeinschaft{fill:#2a78d6}
.t-gemeinschaft{fill:#0b0b0b}
.f-gemeinde{fill:#eb6834}
.t-gemeinde{fill:#0b0b0b}
.f-bund{fill:#1baf7a}
.t-bund{fill:#0b0b0b}
.f-laender{fill:#eda100}
.t-laender{fill:#0b0b0b}
.f-eu{fill:#e87ba4}
.t-eu{fill:#0b0b0b}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}
.ink1{fill:#f0efec}
.ink2{fill:#c3c2b7}
.tile{stroke:#1a1a19}
.f-gemeinschaft{fill:#3987e5}
.t-gemeinschaft{fill:#0b0b0b}
.f-gemeinde{fill:#d95926}
.t-gemeinde{fill:#0b0b0b}
.f-bund{fill:#199e70}
.t-bund{fill:#0b0b0b}
.f-laender{fill:#c98500}
.t-laender{fill:#0b0b0b}
.f-eu{fill:#d55181}
.t-eu{fill:#0b0b0b}
}
</style>
<rect class="bg" width="960" height="600"/>
<text class="ink1" x="0" y="24" font-size="20" font-weight="600">Steuereinnahmen Deutschland 2025: 987.8 Mrd. Euro</text>
<text class="ink2" x="0" y="46" font-size="13">Area = revenue. Sources: BMF Monatsbericht Januar 2026, Destatis. See steuereinnahmen-deutschland.md.</text>
<rect class="f-gemeinschaft" x="0" y="64" width="12" height="12" rx="2"/>
<text class="ink2" x="18" y="75" font-size="13">Gemeinschaftsteuern 746.3</text>
<rect class="f-gemeinde" x="218.0" y="64" width="12" height="12" rx="2"/>
<text class="ink2" x="236.0" y="75" font-size="13">Gemeindesteuern 92.5</text>
<rect class="f-bund" x="400.0" y="64" width="12" height="12" rx="2"/>
